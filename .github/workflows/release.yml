name: Publicar versión

# Al crear una versión (etiqueta v1.3.0, v1.4.0…) compila el APK firmado y lo publica en GitHub Releases.
# Enlace fijo a la última versión: https://github.com/<usuario>/<repositorio>/releases/latest/download/AVD-jump.apk
on:
  push:
    tags: ["v*"]
    # Cambiar el número del archivo VERSION en main publica esa versión.
    branches: ["main"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. 1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (ya instalado en el servidor)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Versión
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sigue PUBLICAR.md, paso 3."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK y AAB firmados
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee gradle.log; then
            # Muestra el error como anotación para leerlo sin abrir el registro completo.
            msg=$(grep -E "^e: |What went wrong|^> |error:|Could not|Unresolved|FAILED" gradle.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Error de compilación::$msg"
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AVD-jump-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/AVD-jump.apk
          cp app/build/outputs/bundle/release/app-release.aab "dist/AVD-jump-$VERSION_NAME-play.aab"

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AVD jump ${{ env.VERSION_NAME }}
          files: |
            dist/AVD-jump-${{ env.VERSION_NAME }}.apk
            dist/AVD-jump.apk
            dist/AVD-jump-${{ env.VERSION_NAME }}-play.aab
          body: |
            **Descargar:** AVD-jump.apk (abajo, en *Assets*).

            El archivo .aab es para subir a Google Play Console; no se instala en el teléfono.

            Instalación: abre el archivo en el teléfono y permite “Instalar apps desconocidas” para tu navegador o administrador de archivos. Requiere Android 9 o superior.
