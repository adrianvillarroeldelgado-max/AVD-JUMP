name: Compilar APK (prueba)

# En cada cambio subido: compila y deja el APK como artefacto descargable de la ejecución.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (ya instalado en el servidor)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Preparar firma (si hay secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Versión de prueba
        run: |
          # Mismo código que una publicación: así el APK de prueba se instala encima de la versión actual.
          echo "VERSION_CODE=$(( ($(git log -1 --format=%ct) - 1704067200) / 60 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION | cut -d. -f1-2)-prueba-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleGithubRelease bundlePlayRelease --stacktrace --console=plain 2>&1 | tee gradle.log; then
            # Muestra el error como anotación para leerlo sin abrir el registro completo.
            msg=$(grep -E "^e: |What went wrong|^> |error:|Could not|Unresolved|FAILED" gradle.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Error de compilación::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AVD-jump-apk
          path: app/build/outputs/apk/github/release/*.apk
